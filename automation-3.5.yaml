          size: 16
          color: black
          anchor: mt
        - type: text
          value: >-
            {{ state_attr('sensor.weatherman_data_tag','wm_time_7') | string |
            upper }}
          font: ../../media/GothamRnd-Bold.ttf
          x: 355
          "y": 85
          size: 16
          color: black
          anchor: mt
        - type: line
          fill: black
          width: 1
          x_start: 160
          y_start: 80
          x_end: 355
          y_end: 80
        - type: text
          value: >-
            {{ state_attr('sensor.weatherman_data_tag','wm_temp_now') | round |
            int(0) }}{{
            state_attr('sensor.weatherman_data_tag','temperature_unit') }}
          font: ../../media/GothamRnd-Bold.ttf
          x: 70
          "y": 120
          size: 48
          anchor: mt
          color: >-
            {{'black' if state_attr('sensor.weatherman_data_tag','wm_temp_now')
            | round > severe_temp_low else 'red' }}
        - type: icon
          value: >-
            weather-{{ state_attr('sensor.weatherman_data_tag','wm_cond_now') |
            string }}
          x: 8
          "y": 2
          size: 120
          color: >-
            {{'red' if state_attr('sensor.weatherman_data_tag','wm_cond_now') in
            severe_weather else 'black' }}
    action: open_epaper_link.drawcustom
    target:
      device_id: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXX #this is the MD5 hash of your TAGs serial number, it is easier to add it in the Visual Editor
variables:
  severe_weather:
    - fog
    - hail
    - lightning
    - lightning-rainy
    - pouring
    - snowy
    - snowy-rainy
    - windy
    - windy-variant
    - exceptional
  severe_temp_low: 3
mode: restart
